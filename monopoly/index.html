<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Монополия — Spark Games</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>window.DICE_SIZE = window.innerWidth > 900 ? 1.35 : 1.0;</script>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/masks.css">
<link rel="stylesheet" href="css/v2.css">
<link rel="stylesheet" href="css/lobby.css">
</head>
<body>

<!-- ==================== ЛОББИ ==================== -->
<div id="lobby">
  <div class="lb-wrap">
    <div class="lb-top">
      <div class="lb-title">Монополия<small>2–5 игроков</small></div>
      <div id="lbMe"></div>
    </div>

    <!-- Главный экран -->
    <div class="lb-screen on" id="lbMain">
      <div class="lb-modes">
        <button class="lb-mode" id="lbBots">
          <div class="lb-mode-ico green">🤖</div>
          <div class="lb-mode-txt"><b>Игра с ботами</b><span>Быстрый матч без ожидания</span></div>
          <div class="lb-mode-arrow">›</div>
        </button>
        <button class="lb-mode" data-go="lbCreate">
          <div class="lb-mode-ico blue">＋</div>
          <div class="lb-mode-txt"><b>Создать комнату</b><span>Пригласить друзей по коду</span></div>
          <div class="lb-mode-arrow">›</div>
        </button>
        <button class="lb-mode" data-go="lbJoin">
          <div class="lb-mode-ico violet">🔑</div>
          <div class="lb-mode-txt"><b>Войти по коду</b><span>Присоединиться к комнате</span></div>
          <div class="lb-mode-arrow">›</div>
        </button>
      </div>

      <div class="lb-sec-head">
        <h2>Открытые комнаты</h2>
        <small>обновляется автоматически</small>
      </div>
      <div id="lbRooms"></div>
    </div>

    <!-- Создание комнаты -->
    <div class="lb-screen" id="lbCreate">
      <button class="lb-back" data-go="lbMain">‹ Назад</button>
      <div class="lb-card">
        <h3>Новая комната</h3>
        <p>Получите код и отправьте его друзьям</p>
        <div class="lb-switch-row" id="lbPrivate">
          <div class="t"><b>Приватная комната</b><span>Не показывать в списке открытых</span></div>
          <div class="lb-sw"></div>
        </div>
        <button class="lb-btn" id="lbCreateGo">Создать</button>
      </div>
    </div>

    <!-- Вход по коду -->
    <div class="lb-screen" id="lbJoin">
      <button class="lb-back" data-go="lbMain">‹ Назад</button>
      <div class="lb-card">
        <h3>Вход по коду</h3>
        <p>Введите код комнаты из шести символов</p>
        <input class="lb-input" id="lbCode" maxlength="6" placeholder="КОД" autocomplete="off">
        <button class="lb-btn" id="lbJoinGo">Войти</button>
      </div>
    </div>

    <!-- Комната ожидания -->
    <div class="lb-screen" id="lbWait">
      <button class="lb-back" id="lbLeave">‹ Выйти из комнаты</button>
      <div class="lb-card">
        <div class="lb-code-box">
          <small>Код комнаты</small>
          <div id="lbWaitCode">——</div>
          <div id="lbWaitPrivate">приватная</div>
        </div>
        <button class="lb-btn ghost" id="lbCopy">Скопировать код</button>
        <div id="lbWaitPlayers"></div>
        <button class="lb-btn" id="lbStart" disabled>Начать игру</button>
        <div id="lbWaitHint"></div>
      </div>
    </div>
  </div>
  <div class="lb-toast" id="lbToast"></div>
</div>

<!-- ==================== ИГРА ==================== -->
<div id="game" style="display:none">
  <div class="app">
    <div class="players-col" id="playersCol"></div>
    <div class="board-zone">
      <div class="board" id="board">
        <div class="board-center">
          <div class="center-panel">
            <div class="service-bar compact" id="serviceBar"></div>
            <div id="diceDock"></div>
            <div class="chat-log" id="chatLog"></div>
            <div class="chat-input-row">
              <input class="chat-input" id="chatInput" placeholder="Сообщение в чат" maxlength="200">
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="libs/three.min.js"></script>
<script src="libs/cannon.min.js"></script>
<script src="libs/socket.io.min.js"></script>
<script src="js/board-data-v2.js"></script>
<script src="js/v2/icon-assets.js"></script>
<script src="js/v2/logos.js"></script>
<script src="js/v2/board-ui.js"></script>
<script src="js/scene/SceneManager.js"></script>
<script src="js/scene/Dice.js"></script>
<script src="js/v2/engine.js"></script>
<script src="js/v2/net.js"></script>
<script src="js/v2/dice-dock.js"></script>
<script src="js/v2/modals.js"></script>
<script src="js/v2/trades.js"></script>
<script src="js/v2/game-ui.js"></script>
<script src="js/v2/lobby.js"></script>
<script>
    if (window.Telegram && Telegram.WebApp) { Telegram.WebApp.ready(); Telegram.WebApp.expand(); }
    Lobby.init();
</script>
</body>
</html>
